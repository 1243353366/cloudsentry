name: Config auditor tests

on:
  push:
    paths:
      - "integrations/config-auditor/**"
      - "scripts/scan-configurations.py"
      - "tests/test_config_auditor_bridge.py"
      - ".github/workflows/config-auditor-tests.yml"
  pull_request:
    paths:
      - "integrations/config-auditor/**"
      - "scripts/scan-configurations.py"
      - "tests/test_config_auditor_bridge.py"
      - ".github/workflows/config-auditor-tests.yml"

permissions:
  contents: read

jobs:
  upstream-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install reviewed vendor test dependencies
        working-directory: integrations/config-auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test the vendored upstream scanner
        working-directory: integrations/config-auditor
        run: python -m pytest
      - name: Test the host bridge contract without host dependencies
        env:
          PYTHONPATH: src
        run: python -m unittest tests/test_config_auditor_bridge.py
