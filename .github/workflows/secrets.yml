name: Secret scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The official action installs the pinned CLI on PATH. Deferring its
      # result lets the mandatory complete scans below run before the job fails.
      - name: Run official incremental secret scan
        id: incremental_scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan all reachable Git history
        run: gitleaks git --no-banner --redact --exit-code=1 --log-opts="--all" .

      - name: Remove action-generated report before checkout scan
        run: rm -f results.sarif

      - name: Scan checked-out working tree
        run: gitleaks dir --no-banner --redact --exit-code=1 .

      - name: Fail if the official incremental scan failed
        if: ${{ steps.incremental_scan.outcome == 'failure' }}
        run: |
          echo "The redacted incremental secret scan failed; see the prior redacted logs."
          exit 1
